<app-acesso>
  <h1>Entrar</h1>
  <p class="acesso-lead">Acesse os registros da sua clínica.</p>

  <form class="formulario" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <div class="aviso-regiao" aria-live="polite">
      @if (erroGeral()) {
        <p class="aviso-erro" data-teste="erro-geral">
          <lucide-icon [img]="icones.CircleAlert" [size]="18" [strokeWidth]="1.5" />{{
            erroGeral()
          }}
        </p>
      }
    </div>

    <div class="campo">
      <label for="login-email">E-mail</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        spellcheck="false"
        [attr.aria-invalid]="erro('email') ? 'true' : null"
        [attr.aria-describedby]="erro('email') ? 'login-email-erro' : null"
      />
      <p id="login-email-erro" class="campo-erro" aria-live="polite">
        @if (erro('email'); as m) {
          <lucide-icon [img]="icones.CircleAlert" [size]="14" [strokeWidth]="1.5" />{{ m }}
        }
      </p>
    </div>

    <div class="campo">
      <label for="login-senha">Senha</label>
      <input
        id="login-senha"
        type="password"
        formControlName="senha"
        autocomplete="current-password"
        [attr.aria-invalid]="erro('senha') ? 'true' : null"
        [attr.aria-describedby]="erro('senha') ? 'login-senha-erro' : null"
      />
      <p id="login-senha-erro" class="campo-erro" aria-live="polite">
        @if (erro('senha'); as m) {
          <lucide-icon [img]="icones.CircleAlert" [size]="14" [strokeWidth]="1.5" />{{ m }}
        }
      </p>
    </div>

    <button
      app-button
      type="submit"
      full
      [variant]="enviando() ? 'progress' : 'primary'"
      [disabled]="enviando()"
    >
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <p class="acesso-alternativa">
    Primeira vez por aqui? <a routerLink="/cadastro">Cadastre sua clínica</a>
  </p>
</app-acesso>
