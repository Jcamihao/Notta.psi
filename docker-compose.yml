# Infra local SO DE DESENVOLVIMENTO (senhas em docker/initdb/01-roles.sql sao publicas).
# Porta 5436 igual ao Postgres embutido, para as mesmas URLs do backend/.env.example.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres-dev
    ports:
      - '5436:5432'
    volumes:
      - notta_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  notta_pgdata:
