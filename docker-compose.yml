# Infra local SO DE DESENVOLVIMENTO (senhas em docker/initdb/01-roles.sql sao publicas).
# Porta 5436 igual ao Postgres embutido, para as mesmas URLs do backend/.env.example.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres-dev
    # So 127.0.0.1: '5436:5432' publicaria em todas as interfaces (0.0.0.0) e no Linux
    # o Docker passa por cima do ufw. Com senhas publicas, a rede local inteira entraria.
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - praxis_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  praxis_pgdata:
